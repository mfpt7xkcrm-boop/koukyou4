<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
公共 小テスト
</title>

<style>

*{
box-sizing:border-box;
font-family:"Yu Gothic",sans-serif;
}

body{
margin:0;
background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);
color:white;
padding-top:80px;
}

.header{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
color:#38bdf8;
z-index:999;
}

.wrap{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:
rgba(255,255,255,.08);
padding:30px;
border-radius:24px;
}

button{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:14px;
font-size:18px;
background:#38bdf8;
color:white;
cursor:pointer;
}

.choice{
background:#334155;
}

.hidden{
display:none;
}

.question{
font-size:32px;
text-align:center;
margin:30px 0;
line-height:1.5;
}

input{
width:100%;
padding:16px;
border:none;
border-radius:12px;
font-size:18px;
}

.feedback{
font-size:28px;
text-align:center;
margin-top:20px;
}

.correct{
color:#4ade80;
}

.wrong{
color:#fb7185;
}

.miss{
margin-top:15px;
padding:15px;
background:#334155;
border-radius:14px;
line-height:1.6;
}

</style>

</head>

<body>

<div class="header">
Hirokakapresents
</div>

<div class="wrap">

<div class="card">

<div id="start">

<h1>
公共 小テスト
</h1>

<button onclick="selectSection('s1a')">
🟦 セクション1-①
<br>
中国思想①
</button>

<button onclick="selectSection('s1b')">
🟦 セクション1-②
<br>
中国思想②
</button>

<button onclick="selectSection('s2')">
🟦 セクション2
<br>
日本思想
</button>

<div
id="mode"
class="hidden">

<h2>
出題形式
</h2>

<button onclick="startQuiz('write')">
記述
</button>

<button onclick="startQuiz('choice')">
4択
</button>

</div>

</div>

<div
id="quiz"
class="hidden">

<div id="count"></div>

<div
class="question"
id="question">

</div>

<div id="writeBox">

<input id="answer">

<button onclick="submitAnswer()">
回答
</button>

</div>

<div id="choices"></div>

<div
class="feedback"
id="feedback">

</div>

<button
id="next"
class="hidden"
onclick="nextQuestion()">

次へ

</button>

</div>

<div
id="result"
class="hidden">

<h1 id="score"></h1>

<div id="mistakes"></div>

<button onclick="location.reload()">
もう一回
</button>

</div>

</div>

</div>

<script>

},

},

{
word:"礼",
correct:"社会秩序を保つための規範",
choices:[

"軍事訓練"
]
},

{
word:"君子",
correct:"徳を備えた理想的人物",
choices:[
"徳を備えた理想的人物",
"国家の王",
"宗教指導者",
"武力を持つ人物"
]
},

{
word:"徳治主義",
correct:"徳によって人々を導く政治",
choices:[
"徳によって人々を導く政治",
"法律で厳しく支配する政治",

"多数決による政治"
]
}

],

s1b:[

{
word:"性善説",
correct:"人間の本性は善であるという考え",
choices:[
"人間の本性は善であるという考え",
"人間の本性は悪であるという考え",

]
},

{

correct:"仁・義・礼・智の芽生え",
choices:[

]
},

{

correct:"徳によって民を導く理想政治",
choices:[

]
},

},

choices:[

]
},

{
word:"理気二元論",
correct:"世界は理と気から成るという考え",
choices:[

"世界は原子から成るという考え"
]
},

{
word:"心即理",
correct:"心そのものが理であるという考え",
choices:[
"心そのものが理であるという考え",

"法律こそ理という考え",
"国家が理という考え"
]
},

{
word:"良知",
correct:"生まれつき備わる善悪判断の心",
choices:[
"生まれつき備わる善悪判断の心",
"学問で得る知識",

"神の啓示"
]
},

{
word:"無為自然",
correct:"作為を捨て自然に従うこと",
choices:[
"作為を捨て自然に従うこと",

"国家に従うこと",
"法律に従うこと"
]
},

{
word:"万物斉同",
correct:"すべての存在は本質的に平等という考え",
choices:[
"すべての存在は本質的に平等という考え",
"人間だけが特別という考え",
"国家が最重要という考え",
"神だけが絶対という考え"
]
}

],

s2:[

{
word:"風土",
correct:"自然環境や気候がつくる生活文化",
choices:[
"自然環境や気候がつくる生活文化",
"国家の法律",
"宗教儀式",
"経済制度"
]
},

{
word:"四季",
correct:"春夏秋冬の四つの季節",
choices:[

]
},

{

correct:"米を育てる農業",
choices:[

]
},

{

correct:"季節ごとの伝統的行事",

]
},

{
word:"八百万の神",
correct:"自然のあらゆるものに神が宿る考え",
choices:[
"自然のあらゆるものに神が宿る考え",

"人間中心の考え",
"無神論"
]
},

{
word:"清明心",
correct:"心が清らかで正しい状態",
choices:[
"心が清らかで正しい状態",
"欲望に満ちた状態",
"怒りに支配された状態",
"迷いの状態"
]
},

{
word:"穢れ",
correct:"不幸や死などで不浄になった状態",
choices:[
"不幸や死などで不浄になった状態",
"幸福な状態",
"修行中の状態",
"神聖な状態"
]
},

{
word:"祓い・禊",
correct:"穢れを清める儀式",
choices:[
"穢れを清める儀式",
"国家行事",
"戦いの訓練",
"仏教修行"
]
},

{
word:"神道",
correct:"日本固有の宗教",
choices:[
"日本固有の宗教",
"中国の宗教",
"インドの宗教",
"西洋の宗教"
]
},

{
word:"神仏習合",
correct:"神道と仏教が結びついた文化",
choices:[
"神道と仏教が結びついた文化",
"神道を否定する考え",
"仏教を禁止する制度",
"唯一神信仰"
]
}

]

}

let questions=[]
let mode=""
let index=0
let scoreValue=0
let wrong=[]

function selectSection(s){

questions=
JSON.parse(
JSON.stringify(
DATA[s]
))

document
.getElementById(
"mode"
)
.classList
.remove(
"hidden"
)

}

function startQuiz(m){

mode=m

document
.getElementById(
"start"
)
.classList
.add(
"hidden"
)

document
.getElementById(
"quiz"
)
.classList
.remove(
"hidden"
)

show()

}

function show(){

const q=
questions[index]

document
.getElementById(
"count"
)
.innerHTML=
`${index+1}/${questions.length}`

document
.getElementById(
"question"
)
.innerHTML=
q.word

document
.getElementById(
"feedback"
)
.innerHTML=""

document
.getElementById(
"next"
)
.classList
.add(
"hidden"
)

document
.getElementById(
"answer"
)
.value=""

if(
mode==="write"
){

document
.getElementById(
"writeBox"
)
.style.display=
"block"

document
.getElementById(
"choices"
)
.innerHTML=""

}else{

document
.getElementById(
"writeBox"
)
.style.display=
"none"

showChoices()

}

}

function showChoices(){

const q=
questions[index]

let html=""

q.choices
.sort(()=>Math.random()-.5)
.forEach(v=>{

html+=
`
<button
class="choice"
onclick=
"judge('${v}')">

${v}

</button>
`

})

document
.getElementById(
"choices"
)
.innerHTML=
html

}

function submitAnswer(){

judge(
document
.getElementById(
"answer"
)
.value
.trim()
)

}

function judge(v){

const q=
questions[index]

const ok=
v===q.correct

if(ok){

scoreValue++

document
.getElementById(
"feedback"
)
.innerHTML=
"<div class='correct'>○ 正解</div>"

}else{

wrong.push(q)

document
.getElementById(
"feedback"
)
.innerHTML=
`
<div class='wrong'>

× 正解

↓

<br>

${q.correct}

</div>
`

}

document
.getElementById(
"next"
)
.classList
.remove(
"hidden"
)

}

function nextQuestion(){

index++

if(
index
<
questions.length
){

show()

}else{

finish()

}

}

function finish(){

document
.getElementById(
"quiz"
)
.classList
.add(
"hidden"
)

document
.getElementById(
"result"
)
.classList
.remove(
"hidden"
)

document
.getElementById(
"score"
)
.innerHTML=
`${scoreValue}/${questions.length}`

let html=""

wrong.forEach(v=>{

html+=
`
<div class="miss">

${v.word}

↓

<br>

${v.correct}

</div>
`

})

document
.getElementById(
"mistakes"
)
.innerHTML=
html
||
"全問正解！"

}

document
.addEventListener(
"keydown",

e=>{

if(
e.key==="Enter"
&&
mode==="write"
){

submitAnswer()

}

}

)

</script>

</body>

</html>
